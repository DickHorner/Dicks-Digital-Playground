name: typst-skill-poc

on:
  push:
    branches:
      - typst-skill-poc

jobs:
  package-typst:
    runs-on: ubuntu-latest
    steps:
      - name: Download Typst
        run: |
          curl -L --fail -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst.tar.xz
          cp typst-x86_64-unknown-linux-musl/typst ./typst
          chmod +x ./typst
          ./typst --version
      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: typst-linux-x86_64
          path: typst
          retention-days: 1
